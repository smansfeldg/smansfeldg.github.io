<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Santiago Ariel Mansfeld | DevOps Engineer</title>
    <!-- /en/ ya no es una ruta del sitio: el idioma se cambia en cliente. Esta
         página existe solo para que los enlaces ya publicados (y lo que Google
         tenga indexado) sigan llegando a algún lado, en inglés. -->
    <link rel="canonical" href="https://smansfeldg.github.io/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      try {
        localStorage.setItem("lang", "en")
      } catch (error) {
        /* Modo privado o storage bloqueado: la redirección sigue funcionando. */
      }
      window.location.replace("/")
    </script>
  </head>
  <body>
    <p><a href="/">Continue to smansfeldg.github.io</a></p>
  </body>
</html>
